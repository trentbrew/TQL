[package]
name = "tql-tui"
version = "0.1.0"
edition = "2021"
authors = ["TQL Contributors"]
description = "Interactive terminal UI for TQL (Tree Query Language)"
license = "MIT"

[[bin]]
name = "tql-tui"
path = "src/main.rs"

[dependencies]
# TUI Framework
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1.45", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
color-eyre = "0.6"
thiserror = "2.0"

# Graph layout
petgraph = "0.6"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Utilities
chrono = "0.4"
unicode-width = "0.2"

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
